name: test
on:
  workflow_dispatch:
  pull_request:
    branches: [main, release/*]
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ros_distribution:
          - foxy
          - humble
          - iron
          - jazzy
          - kilted
          - lyrical
        include:
          - ros_distribution: foxy
            docker_image: ros:foxy-ros-base
          - ros_distribution: humble
            docker_image: ros:humble-ros-base
          - ros_distribution: iron
            docker_image: ros:iron-ros-base
          - ros_distribution: jazzy
            docker_image: ros:jazzy-ros-base
          - ros_distribution: kilted
            docker_image: ros:kilted-ros-base
          - ros_distribution: lyrical
            docker_image: ros:lyrical-ros-base
    container:
      image: ${{ matrix.docker_image }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install additional ROS dependencies
        run: |
          . /opt/ros/${{ matrix.ros_distribution }}/setup.sh
          # ros:foxy-ros-base is no longer being updated due to EOL of foxy.
          # We have to pull the new GPG key for ROS package repository manually.
          if [ "${{ matrix.ros_distribution }}" = "foxy" ]; then
            apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 4B63CF8FDE49746E98FA01DDAD19BAB3CBF125EA
          fi
          apt update
          apt install -y curl python3-colcon-common-extensions
          if [ "${{ matrix.ros_distribution }}" = "lyrical" ]; then
            apt install -y libicu78
          fi
          rosdep update --include-eol-distros
          rosdep install -i -y --from-paths src/Rcl.NET.Tests src/CodegenTests/packages/ros2cs_abi_test_msgs

      - name: Build ABI test interfaces
        run: |
          . /opt/ros/${{ matrix.ros_distribution }}/setup.sh
          colcon build --merge-install --packages-select ros2cs_abi_test_msgs --base-paths src/CodegenTests/packages

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0.x

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Test code generation
        run: |
          . /opt/ros/${{ matrix.ros_distribution }}/setup.sh
          . "$GITHUB_WORKSPACE/install/setup.sh"
          dotnet test src/CodegenTests/CodegenTests.csproj -c Release --verbosity normal

      - name: Test Rosidl runtime
        run: |
          . /opt/ros/${{ matrix.ros_distribution }}/setup.sh
          . "$GITHUB_WORKSPACE/install/setup.sh"
          dotnet test src/Rosidl.Runtime.Tests/Rosidl.Runtime.Tests.csproj -c Release --verbosity normal

      - name: Build
        working-directory: src/Rcl.NET.Tests
        run: |
          dotnet nuget locals all --clear
          dotnet build -c Release
      
      - name: Test (fastrtps)
        working-directory: src/Rcl.NET.Tests
        env:
          RMW_IMPLEMENTATION: rmw_fastrtps_cpp
          ROS_LOCALHOST_ONLY: 0
        run: |
          . /opt/ros/${{ matrix.ros_distribution }}/setup.sh && \
          . "$GITHUB_WORKSPACE/install/setup.sh" && \
          dotnet test -c Release -p:TestTfmsInParallel=false --no-build --verbosity normal --blame-crash-dump-type mini --blame-hang-dump-type none --blame-hang-timeout 1m

      - name: Test (cyclonedds)
        if: ${{ matrix.ros_distribution != 'foxy' }}
        working-directory: src/Rcl.NET.Tests
        env:
          RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
          ROS_LOCALHOST_ONLY: 0
        run: |
          . /opt/ros/${{ matrix.ros_distribution }}/setup.sh && \
          . "$GITHUB_WORKSPACE/install/setup.sh" && \
          dotnet test -c Release -p:TestTfmsInParallel=false --no-build --verbosity normal --blame-crash-dump-type mini --blame-hang-dump-type none --blame-hang-timeout 1m

  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        ros_distribution:
          - foxy
          - humble
          - iron
          - jazzy
          - kilted
          - lyrical
        include:
          - ros_distribution: lyrical
            ros_archive: https://github.com/ros2/ros2/releases/download/release-lyrical-20260807/ros2-lyrical-2026-08-07-windows-AMD64.zip
            is_legacy_distro: false
          - ros_distribution: kilted
            ros_archive: https://github.com/ros2/ros2/releases/download/release-kilted-20250728/ros2-kilted-20250728-windows-release-amd64.zip
            is_legacy_distro: false
          - ros_distribution: jazzy
            ros_archive: https://github.com/ros2/ros2/releases/download/release-jazzy-20260128/ros2-jazzy-20260128-windows-release-amd64.zip
            is_legacy_distro: false
          - ros_distribution: iron
            ros_archive: https://github.com/ros2/ros2/releases/download/release-iron-20241204/ros2-iron-20241204-windows-release-amd64.zip
            is_legacy_distro: true
          - ros_distribution: humble
            ros_archive: https://github.com/ros2/ros2/releases/download/release-humble-20241205/ros2-humble-20241205-windows-release-amd64.zip
            is_legacy_distro: true
          - ros_distribution: foxy
            ros_archive: https://github.com/ros2/ros2/releases/download/release-foxy-20230620/ros2-foxy-20230620-windows-release-amd64.zip
            is_legacy_distro: true
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Restore cached ROS installation
        id: ros-cache
        uses: actions/cache@v3
        with:
          path: c:/dev/${{ matrix.ros_distribution }}/
          key: ${{ matrix.ros_archive }}

      - name: Download and install ROS
        if: ${{ steps.ros-cache.outputs.cache-hit != 'true' }}
        run: |
          Invoke-WebRequest -Uri ${{ matrix.ros_archive }} -OutFile ros2-release.zip
          Expand-Archive -Path ros2-release.zip c:/dev/${{ matrix.ros_distribution }}

      - name: Setup Python (Legacy)
        if: ${{ matrix.is_legacy_distro }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies (Legacy)
        if: ${{ matrix.is_legacy_distro }}
        run: |
          reg add HKCU\SOFTWARE\Kitware\CMake /f
          Invoke-WebRequest -Uri https://github.com/ros2/choco-packages/releases/download/2022-03-15/tinyxml2.6.0.0.nupkg -OutFile tinyxml2.6.0.0.nupkg
          choco install --limit-output --no-progress -y -s . tinyxml2
          choco install --limit-output --no-progress -y openssl --version 1.1.1.2100
          python -m pip install --upgrade "setuptools<60" "numpy<2" catkin_pkg colcon-common-extensions empy==3.3.4 lark-parser

      - name: Install Pixi
        if: ${{ !matrix.is_legacy_distro }}
        run: |
          Set-ExecutionPolicy ByPass
          irm -useb https://pixi.sh/install.ps1 | iex

      - name: Restore cached Pixi dependencies
        if: ${{ !matrix.is_legacy_distro }}
        id: pixi-cache
        uses: actions/cache@v3
        with:
          path: c:/dev/pixi/
          key: pixi-${{ matrix.ros_distribution }}

      - name: Install dependencies
        if: ${{ !matrix.is_legacy_distro }}
        run: |
          New-Item -ItemType Directory -Force c:/dev/pixi/ | Out-Null
          cd c:/dev/pixi/
          irm https://raw.githubusercontent.com/ros2/ros2/refs/heads/${{ matrix.ros_distribution }}/pixi.toml -OutFile pixi.toml
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          pixi install

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Find Visual Studio developer command prompt
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio C++ tools not found.' }
          $vsDevCmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          "VSDEVCMD=$vsDevCmd" >> $env:GITHUB_ENV

      - name: Build ABI test interfaces (Legacy)
        if: ${{ matrix.is_legacy_distro }}
        shell: cmd
        run: |
          refreshenv && ^
          call "%VSDEVCMD%" -arch=amd64 && ^
          set "PATH=%pythonLocation%;%pythonLocation%\Scripts;%PATH%" && ^
          call c:/dev/${{ matrix.ros_distribution }}/ros2-windows/setup.bat && ^
          "%pythonLocation%\Scripts\colcon.exe" build --merge-install --packages-select ros2cs_abi_test_msgs --base-paths src/CodegenTests/packages --cmake-args "-DPython3_EXECUTABLE=%pythonLocation%\python.exe"

      - name: Build ABI test interfaces
        if: ${{ !matrix.is_legacy_distro }}
        shell: cmd
        run: |
          refreshenv && ^
          call "%VSDEVCMD%" -arch=amd64 && ^
          pixi run --manifest-path "c:/dev/pixi/" ^
          cmd /c "call c:/dev/${{ matrix.ros_distribution }}/ros2-windows/setup.bat && colcon build --merge-install --packages-select ros2cs_abi_test_msgs --base-paths src/CodegenTests/packages"

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0.x

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Test code generation (Legacy)
        if: ${{ matrix.is_legacy_distro }}
        shell: cmd
        run: |
          refreshenv && ^
          call c:/dev/${{ matrix.ros_distribution }}/ros2-windows/setup.bat && ^
          call install/setup.bat && ^
          dotnet test src/CodegenTests/CodegenTests.csproj -c Release --verbosity normal

      - name: Test code generation
        if: ${{ !matrix.is_legacy_distro }}
        shell: cmd
        run: |
          refreshenv && ^
          pixi run --manifest-path "c:/dev/pixi/" ^
          cmd /c "call c:/dev/${{ matrix.ros_distribution }}/ros2-windows/setup.bat && call install/setup.bat && dotnet test src/CodegenTests/CodegenTests.csproj -c Release --verbosity normal"

      - name: Test Rosidl runtime (Legacy)
        if: ${{ matrix.is_legacy_distro }}
        shell: cmd
        run: |
          refreshenv && ^
          call c:/dev/${{ matrix.ros_distribution }}/ros2-windows/setup.bat && ^
          call install/setup.bat && ^
          dotnet test src/Rosidl.Runtime.Tests/Rosidl.Runtime.Tests.csproj -c Release --verbosity normal

      - name: Test Rosidl runtime
        if: ${{ !matrix.is_legacy_distro }}
        shell: cmd
        run: |
          refreshenv && ^
          pixi run --manifest-path "c:/dev/pixi/" ^
          cmd /c "call c:/dev/${{ matrix.ros_distribution }}/ros2-windows/setup.bat && call install/setup.bat && dotnet test src/Rosidl.Runtime.Tests/Rosidl.Runtime.Tests.csproj -c Release --verbosity normal"

      - name: Build
        working-directory: src/Rcl.NET.Tests
        run: |
          dotnet nuget locals all --clear
          dotnet build -c Release

      - name: Test (fastrtps) (Legacy)
        if: ${{ matrix.is_legacy_distro }}
        shell: cmd
        working-directory: src/Rcl.NET.Tests
        env:
          RMW_IMPLEMENTATION: rmw_fastrtps_cpp
          ROS_LOCALHOST_ONLY: 0
        run: |
          refreshenv && ^
          call c:/dev/${{ matrix.ros_distribution }}/ros2-windows/setup.bat && ^
          call ${{ github.workspace }}/install/setup.bat && ^
          dotnet test -c Release -p:TestTfmsInParallel=false --no-build --verbosity normal --blame-crash-dump-type mini --blame-hang-dump-type none --blame-hang-timeout 1m

      - name: Test (cyclonedds) (Legacy)
        if: ${{ matrix.is_legacy_distro && matrix.ros_distribution != 'foxy' }}
        shell: cmd
        working-directory: src/Rcl.NET.Tests
        env:
          RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
          ROS_LOCALHOST_ONLY: 0
        run: |
          refreshenv && ^
          call c:/dev/${{ matrix.ros_distribution }}/ros2-windows/setup.bat && ^
          call ${{ github.workspace }}/install/setup.bat && ^
          dotnet test -c Release -p:TestTfmsInParallel=false --no-build --verbosity normal --blame-crash-dump-type mini --blame-hang-dump-type none --blame-hang-timeout 1m

      - name: Test (fastrtps)
        if: ${{ !matrix.is_legacy_distro }}
        shell: cmd
        working-directory: src/Rcl.NET.Tests
        env:
          RMW_IMPLEMENTATION: rmw_fastrtps_cpp
          ROS_LOCALHOST_ONLY: 0
        run: |
          refreshenv && ^
          pixi run --manifest-path "c:/dev/pixi/" ^
          cmd /c "call c:/dev/${{ matrix.ros_distribution }}/ros2-windows/setup.bat && call ${{ github.workspace }}/install/setup.bat && dotnet test -c Release -p:TestTfmsInParallel=false --no-build --verbosity normal --blame-crash-dump-type mini --blame-hang-dump-type none --blame-hang-timeout 1m"

      - name: Test (cyclonedds)
        if: ${{ !matrix.is_legacy_distro }}
        shell: cmd
        working-directory: src/Rcl.NET.Tests
        env:
          RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
          ROS_LOCALHOST_ONLY: 0
        run: |
          refreshenv && ^
          pixi run --manifest-path "c:/dev/pixi/" ^
          cmd /c "call c:/dev/${{ matrix.ros_distribution }}/ros2-windows/setup.bat && call ${{ github.workspace }}/install/setup.bat && dotnet test -c Release -p:TestTfmsInParallel=false --no-build --verbosity normal --blame-crash-dump-type mini --blame-hang-dump-type none --blame-hang-timeout 1m"
